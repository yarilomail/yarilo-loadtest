name: CI — yarilo-loadtest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

## Cancel superseded runs on the same ref. PR pushes supersede each other, so an
## in-flight run for an older commit is wasted work. Runs on main are never
## cancelled: build/push and the release it triggers must complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

## No paths filter, unlike the server repo. Everything here is either the tool
## or its build, so there is no class of change that legitimately skips CI — and
## a filter would mean required status checks could never report on some PRs.
env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/yarilo-loadtest
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v6.0.0
        with:
          go-version: "1.26.2"
          cache-dependency-path: go.mod

      ## The linter is the expensive part of this job: installing it compiles
      ## its whole dependency tree, which took longer than everything else here
      ## put together. Cached on its pinned version, so it is built once and
      ## restored after that; a version bump misses the key and rebuilds, which
      ## is exactly when a rebuild is warranted.
      - name: Cache golangci-lint
        id: lint-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-v1.64.8-go1.26.2-${{ runner.os }}

      ## Pinned to the version the server repo uses. A floating install means a
      ## green PR can go red on merge without a code change.
      - name: Install golangci-lint
        if: steps.lint-cache.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Add GOPATH bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v6.0.0
        with:
          go-version: "1.26.2"
          cache-dependency-path: go.mod

      ## -race because this is a concurrency tool. A data race here would show
      ## up as noise in the numbers it produces, which is the one failure mode
      ## nobody would trace back to the generator.
      - name: Run tests
        run: go test -race ./...

  build:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      ## VERSION plays the part helm/Chart.yaml appVersion plays in the server
      ## repo: one file is the release trigger. Bump it and a git tag, a GitHub
      ## release and a semver image tag follow; leave it and main is built
      ## without any of them.
      - name: Determine release version
        id: version
        run: |
          APP_VERSION=$(tr -d ' \n' < VERSION)
          RELEASE_TAG="v${APP_VERSION}"
          if git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | grep -q "${RELEASE_TAG}"; then
            IS_RELEASE=false
          else
            IS_RELEASE=true
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

      ## The default docker-container driver, not the docker one the server
      ## repo uses. That repo builds on a self-hosted runner whose daemon keeps
      ## its layer cache between runs, so the plain docker driver is enough
      ## there. Here every run starts on a fresh hosted runner, so the layers
      ## have to come from somewhere — and the docker driver cannot export a
      ## cache at all, which is what failed the first build on main.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.image_tag }},enable=${{ steps.version.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.image_tag }}

      - name: Generate release notes
        if: steps.version.outputs.is_release == 'true'
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Push git tag
        if: steps.version.outputs.is_release == 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md

      - name: Cleanup old GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: yarilo-loadtest
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
